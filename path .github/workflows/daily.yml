name: Daily Defence Brief
on:
  schedule:
    - cron: '30 2 * * *'  # 2:30 UTC = 8:00 AM IST
  workflow_dispatch:

jobs:
  brief:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install feedparser google-generativeai
      - run: python main.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          EMAIL: ${{ secrets.EMAIL }}
          APP_PASS: ${{ secrets.APP_PASS }}
